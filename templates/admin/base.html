<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#292d32">
    <title>{% block title %}Панель управления{% endblock %} — Томск Монолит</title>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
<header class="admin-header">
    <a class="admin-brand" href="{{ url_for('admin_dashboard') }}">ТОМСК МОНОЛИТ<span>ПАНЕЛЬ УПРАВЛЕНИЯ</span></a>
    <nav class="admin-nav" aria-label="Разделы административной панели">
        <a href="{{ url_for('admin_dashboard') }}" {% if request.endpoint in ('admin_dashboard', 'admin_order') %}class="active"{% endif %}>Заявки</a>
        <a href="{{ url_for('admin_content') }}" {% if request.endpoint == 'admin_content' %}class="active"{% endif %}>Содержимое и настройки</a>
        <a href="{{ url_for('admin_gallery') }}" {% if request.endpoint == 'admin_gallery' %}class="active"{% endif %}>Фотографии</a>
        <a href="{{ url_for('index') }}" target="_blank" rel="noopener">Открыть сайт ↗</a>
    </nav>
    <form class="admin-logout" method="post" action="{{ url_for('admin_logout') }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button type="submit">Выйти</button></form>
</header>
<main class="admin-main">
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash flash-{{ category }}" role="status">{{ message }}</div>{% endfor %}{% endwith %}
    {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/admin.js') }}" defer></script>
</body>
</html>
